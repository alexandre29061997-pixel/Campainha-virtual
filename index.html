<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campainha Inteligente Real (P2P)</title>
    <!-- Biblioteca de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS para conexão direta e gratuita entre dispositivos -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #dc2626;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: var(--primary-hover); }
        button.danger { background: var(--danger); }
        button.danger:hover { background: #b91c1c; }
        button.success { background: var(--success); }
        button.success:hover { background: #15803d; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        
        #qrcode-box { display: flex; justify-content: center; margin: 20px 0; background: #f1f5f9; padding: 20px; border-radius: 12px; }
        
        #call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; padding: 20px; }
        .video-container { display: flex; gap: 10px; width: 100%; max-width: 600px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        video { width: 100%; max-width: 280px; height: 210px; background: #334155; border-radius: 12px; object-fit: cover; border: 2px solid #cbd5e1; }
        .call-actions { display: flex; gap: 15px; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: PAINEL DO MORADOR (CONECTANDO) -->
        <div id="screen-morador" class="hidden">
            <h1>🏠 Painel do Morador</h1>
            <p class="text-center" style="color: #64748b; font-size: 0.9rem; margin-bottom: 15px;">Deixe esta página aberta no seu celular ou computador de casa.</p>
            
            <div class="form-group text-center">
                <label>QR Code para colocar na porta</label>
                <div id="qrcode-box"><div id="qrcode"></div></div>
                <p id="connection-status" style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">Conectando à rede P2P...</p>
                <button onclick="downloadQRCode()" style="background: #334155; margin-top: 15px;">Baixar Imagem QR Code</button>
            </div>
        </div>

        <!-- TELA 2: TELA DO VISITANTE (QUANDO ESCANEIA O QR CODE) -->
        <div id="screen-visitante" class="hidden">
            <h1>🚪 Campainha Externa</h1>
            <p class="text-center" style="margin-bottom: 25px; color: #64748b;">Toque no botão para chamar o morador em tempo real.</p>
            <button id="btn-ring" class="success" onclick="tocarCampainhaReal()" style="padding: 22px; font-size: 1.3rem;">🔔 TOCAR CAMPAINHA</button>
            
            <video id="visitor-camera" style="display:none;" autoplay playsinline></video>
            <canvas id="photo-canvas" style="display:none;"></canvas>
        </div>
    </div>

    <!-- MODAL DE CHAMADA AO VIVO PARA O MORADOR -->
    <div id="call-overlay" class="hidden">
        <h2 id="call-title" style="margin-bottom: 15px;">📞 Campainha Tocando!</h2>
        
        <div class="video-container">
            <div>
                <p style="font-size: 0.8rem; text-align: center; margin-bottom: 5px;">Câmera do Visitante</p>
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>

        <div class="call-actions">
            <button class="danger" onclick="desligarChamada()">Desligar</button>
        </div>
    </div>

    <script>
        let peer;
        let myId = "";
        let activeConnection = null;
        let activeCall = null;
        let ringInterval;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ownerId = urlParams.get('owner');

            if (ownerId) {
                // Modo Visitante (Veio pelo QR Code da rua)
                document.getElementById('screen-visitante').classList.remove('hidden');
                inicializarVisitante(ownerId);
            } else {
                // Modo Morador (Está em casa configurando)
                document.getElementById('screen-morador').classList.remove('hidden');
                inicializarMorador();
            }
        };

        // --- MODO MORADOR (CASA) ---
        function inicializarMorador() {
            // Cria um identificador único aleatório para o morador usando PeerJS gratuito
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('connection-status').innerText = "Status: Online e Conectado!";
                gerarQRCode(myId);
            });

            // Recebe dados de toque ou chamadas de vídeo do visitante
            peer.on('connection', (conn) => {
                activeConnection = conn;
                conn.on('data', (data) => {
                    if (data.type === 'RING') {
                        tocarAlarmeSonoro();
                        document.getElementById('call-overlay').classList.remove('hidden');
                    }
                });
            });

            peer.on('call', (call) => {
                // Atende automaticamente a transmissão de vídeo do visitante quando ele toca
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    call.answer(stream); // Responde com o áudio/vídeo da casa se quiser
                    call.on('stream', (remoteStream) => {
                        const remoteVideo = document.getElementById('remote-video');
                        remoteVideo.srcObject = remoteStream;
                    });
                    activeCall = call;
                }).catch(err => {
                    console.error("Erro na webcam:", err);
                });
            });
        }

        function gerarQRCode(id) {
            const baseUrl = window.location.href.split('?')[0];
            const visitorUrl = `${baseUrl}?owner=${id}`;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: visitorUrl, width: 160, height: 160 });
        }

        function downloadQRCode() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if(qrCanvas) {
                const link = document.createElement('a');
                link.download = 'qrcode-campainha.png';
                link.href = qrCanvas.toDataURL();
                link.click();
            }
        }

        // --- MODO VISITANTE (RUA) ---
        function inicializarVisitante(ownerId) {
            peer = new Peer();
            peer.on('open', () => {
                // Conecta diretamente ao ID do morador
                window.moradorConn = peer.connect(ownerId);
            });
        }

        function tocarCampainhaReal() {
            const btn = document.getElementById('btn-ring');
            btn.disabled = true;
            btn.innerText = "🔔 CHAMANDO O MORADOR...";

            tocarAlarmeSonoro();

            if (window.moradorConn) {
                window.moradorConn.send({ type: 'RING' });
            }

            // Inicia chamada de vídeo direta para o morador
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                const call = peer.call(new URLSearchParams(window.location.search).get('owner'), stream);
                call.on('stream', (remoteStream) => {
                    // Opcional: mostrar retorno se houver
                });
            }).catch(err => {
                alert("Permissão de câmera necessária para chamar.");
            });

            alert('Campainha tocada com sucesso para a casa!');
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "🔔 TOCAR CAMPAINHA";
            }, 3000);
        }

        // --- UTILITÁRIOS DE ÁUDIO E CHAMADA ---
        function tocarAlarmeSonoro() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ringInterval = setInterval(() => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }, 800);
        }

        function desligarChamada() {
            clearInterval(ringInterval);
            document.getElementById('call-overlay').classList.add('hidden');
            if (activeCall) activeCall.close();
        }
    </script>
</body>
</html>
